[package]
name = "disjoint_slice_len"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[package.metadata.cuda-oxide]
extra-rustflags = ["-Zinline-mir=no"]

[workspace]

[dependencies]
cuda-device = { path = "../../../cuda-device" }
cuda-host = { path = "../../../cuda-host" }
cuda-core = {git = "https://github.com/ansidium/cutile-rs", rev = "b4eae9b2a783eba8e18587aa2b760f985a07f866"}

# The mir-importer intercepts `DisjointSlice::len` only when rustc's MIR
# inliner leaves the call intact. cargo-oxide reads this package metadata and
# applies the flag only to this example's codegen invocation.
